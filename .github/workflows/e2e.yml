name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if E2E credentials are missing
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::E2E_EMAIL/E2E_PASSWORD ausentes — todos os specs seriam skipados. Configure os secrets em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json

      - name: Fail if any test was skipped (skips mascaram cobertura, ex.: Escape no ProductReadinessBadge)
        run: |
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('playwright-results.json','utf8'));
            const skipped = new Set();
            const walk = (suite) => {
              for (const s of suite.suites ?? []) walk(s);
              for (const spec of suite.specs ?? [])
                for (const t of spec.tests ?? [])
                  for (const res of t.results ?? [])
                    if (res.status === 'skipped' || t.status === 'skipped')
                      skipped.add(spec.title);
            };
            for (const s of r.suites ?? []) walk(s);
            if (skipped.size) {
              console.error('::error::' + skipped.size + ' teste(s) skipados — CI exige execução real:');
              for (const t of skipped) console.error(' - ' + t);
              process.exit(1);
            }
            console.log('OK: nenhum teste skipado.');
          "

      - name: Audit Escape scenario coverage (ready + pending must have run green)
        id: escape_audit
        run: node scripts/audit-escape-e2e.mjs playwright-results.json

      # When the Escape audit fails, collect ONLY the Escape-related traces,
      # screenshots and videos into a focused bundle so it's fast to inspect.
      - name: Collect Escape failure artifacts
        if: failure() && steps.escape_audit.outcome == 'failure'
        run: |
          set -e
          mkdir -p escape-failure-bundle
          if [ -d test-results ]; then
            # Playwright names per-test dirs after the spec + title; grep by
            # spec filename fragment and by "escape" in the title.
            find test-results -mindepth 1 -maxdepth 1 -type d \( \
              -iname '*escape*' -o \
              -iname '*enter-space*' -o \
              -iname '*product-readiness-badge*' \
            \) -exec cp -r {} escape-failure-bundle/ \;
          fi
          cp playwright-results.json escape-failure-bundle/ 2>/dev/null || true
          echo "Bundle contents:" && ls -R escape-failure-bundle || true

      - name: Upload Escape failure bundle (traces + screenshots + videos)
        if: failure() && steps.escape_audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: escape-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: escape-failure-bundle/**
          if-no-files-found: warn
          retention-days: 14

      # Always upload the full report + raw test-results as a fallback.
      - name: Upload full Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**
            playwright-report/**
            playwright-results.json
          if-no-files-found: ignore
          retention-days: 14
